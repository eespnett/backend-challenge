name: wagering-challenge
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
      LOCALSTACK_HOST: localstack:4566
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/wagering-queues-ready && awslocal sqs get-queue-url --queue-name wager-transactions.fifo > /dev/null"]
      interval: 2s
      timeout: 5s
      retries: 60

  migrate:
    build: .
    command: ["bun", "scripts/migrate.ts", "up"]
    environment: &app-environment
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: wagering_local
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      PENDING_REFERENCE_WORKER_ENABLED: "${PENDING_REFERENCE_WORKER_ENABLED:-true}"
      SQS_CONSUMER_ENABLED: "${SQS_CONSUMER_ENABLED:-true}"
      SQS_TRANSACTION_QUEUE_NAME: "${SQS_TRANSACTION_QUEUE_NAME:-wager-transactions.fifo}"
      SQS_DLQ_QUEUE_NAME: "${SQS_DLQ_QUEUE_NAME:-wager-transactions-dlq.fifo}"
      SQS_SHUTDOWN_TIMEOUT_MS: "${SQS_SHUTDOWN_TIMEOUT_MS:-10000}"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment: *app-environment
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres-data:
